<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Store</title>
  <link rel="stylesheet" href="Task_2_style.css" />
</head>
<body>
  <main class="product-page">
    <div class="product-card">
      <img src="image.jpg" alt="Product Image" class="product-card__image" />
      <h2 class="product-card__title">Wireless Headphones</h2>
      <p class="product-card__price">$59.99</p>
      <button class="product-card__button" onclick="addToCart()">Add to Cart</button>
    </div>
  </main>

  <script>
    function addToCart() {
      alert("Product added to cart!");
    }
  </script>
</body>
</html>
